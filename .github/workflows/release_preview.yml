name: Release Preview
on:
  pull_request:
    branches: [dev]
    types: [opened, synchronize, labeled, unlabeled, edited]

jobs:
  release_preview:
    uses: OpenVoiceOS/gh-automations/.github/workflows/release-preview.yml@dev
    with:
      version_file: ovos_pydantic_models/version.py
    secrets: inherit
