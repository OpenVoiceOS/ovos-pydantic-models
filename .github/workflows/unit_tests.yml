name: Build Tests
on:
  pull_request:
    branches: [dev]
    types: [opened, synchronize]
  push:
    branches: [dev]
  workflow_dispatch:

jobs:
  build_tests:
    uses: OpenVoiceOS/gh-automations/.github/workflows/build-tests.yml@dev
    with:
      python_versions: '["3.10", "3.11", "3.12"]'
      install_extras: dev
      test_path: test/
    secrets: inherit
